name: Firebird 5.0.4

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up Firebird 5.0.4
      run: |
        docker run --detach \
          --name firebirdsql \
          --publish 3050:3050 \
          --publish 3051:3051 \
          --env FIREBIRD_ROOT_PASSWORD=masterkey \
          --env FIREBIRD_CONF_RemoteBindAddress=0.0.0.0 \
          --env FIREBIRD_CONF_RemoteAuxPort=3051 \
          --env FIREBIRD_CONF_WireCrypt=Enabled \
          firebirdsql/firebird:5.0.4

        for attempt in {1..30}; do
          if (echo > /dev/tcp/127.0.0.1/3050) 2>/dev/null; then
            exit 0
          fi
          sleep 1
        done

        docker logs firebirdsql
        exit 1

    - name: Set up Go 1.26
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    - name: Firebird logs
      if: always()
      run: |
        docker logs firebirdsql || true
        docker stop firebirdsql || true
