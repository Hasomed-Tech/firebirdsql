name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go: ['1.26']
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup FirebirdSQL container
      run: |
        docker run --detach \
          --name firebirdsql \
          --publish 3050:3050 \
          --publish 3051:3051 \
          --env ISC_PASSWORD=masterkey \
          jacobalberty/firebird:2.5-ss

        docker exec firebirdsql sed -i \
          's/^[[:space:]#]*RemoteAuxPort[[:space:]]*=.*/RemoteAuxPort = 3051/' \
          /firebird/etc/firebird.conf
        docker restart firebirdsql
        docker exec firebirdsql grep 'RemoteAuxPort = 3051' \
          /firebird/etc/firebird.conf

        for attempt in {1..30}; do
          if (echo > /dev/tcp/127.0.0.1/3050) 2>/dev/null; then
            exit 0
          fi
          sleep 1
        done

        docker logs firebirdsql
        exit 1

    - name: Set up Go ${{ matrix.go }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    - name: Firebird logs
      if: always()
      run: |
        docker logs firebirdsql || true
        docker stop firebirdsql || true
